name: 日内盯盘

# 交易日 09:00-11:30、13:30-15:00、21:00-23:00（北京时间 = UTC+8）
# GitHub 的 cron 使用 UTC：1-3 = 09:00-11:59，5-7 = 13:00-15:59，13-15 = 21:00-23:59
# 行情每 5 分钟刷新；历史数据复盘在脚本里按 15 分钟节流
on:
  schedule:
    - cron: '*/5 1-3,5-7,13-15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write        # 需要把 data/*.csv 提交回仓库

concurrency:
  group: realtime
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
      HISTORY_MODE: always
      HISTORY_INTERVAL_MIN: '15'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行实时盯盘
        run: python main.py --mode realtime

      - name: 提交历史 CSV
        run: |
          git config user.name "futures-bot"
          git config user.email "futures-bot@users.noreply.github.com"
          if [ -d data ] && [ -n "$(git status --porcelain data)" ]; then
            git add data
            git commit -m "history: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase --autostash
            git push
          else
            echo "没有新的历史数据，跳过提交"
          fi
