name: 日内盯盘

# 交易时段（北京时间 = UTC+8）：
#   09:00-11:30  ->  UTC 01:00-03:30
#   13:30-15:00  ->  UTC 05:30-07:00
#   21:00-23:00  ->  UTC 13:00-15:00
# 只在这些时段每 5 分钟拉一次行情，避免午休/收盘后写入无变化的平线数据
on:
  schedule:
    - cron: '*/5 1-2 * * 1-5'                  # 09:00-10:55
    - cron: '0,5,10,15,20,25,30 3 * * 1-5'     # 11:00-11:30
    - cron: '30,35,40,45,50,55 5 * * 1-5'      # 13:30-13:55
    - cron: '*/5 6 * * 1-5'                    # 14:00-14:55
    - cron: '0 7 * * 1-5'                      # 15:00 收盘
    - cron: '*/5 13-14 * * 1-5'                # 21:00-22:55
    - cron: '0 15 * * 1-5'                     # 23:00 夜盘收盘
  workflow_dispatch:
    inputs:
      force_history:
        description: '忽略 15 分钟节流，立即写一次历史与 CSV（测试用）'
        type: boolean
        default: false

permissions:
  contents: write        # 需要把 data/*.csv 提交回仓库

concurrency:
  group: realtime
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
      HISTORY_MODE: always
      HISTORY_INTERVAL_MIN: '15'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行实时盯盘
        run: python main.py --mode realtime ${{ inputs.force_history && '--force-history' || '' }}

      - name: 提交历史 CSV
        run: |
          git config user.name "futures-bot"
          git config user.email "futures-bot@users.noreply.github.com"
          if [ -d data ] && [ -n "$(git status --porcelain data)" ]; then
            git add data
            git commit -m "history: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase --autostash
            git push
          else
            echo "没有新的历史数据，跳过提交"
          fi
