name: 日内盯盘

# 由外部定时器（Cloudflare Worker）通过 repository_dispatch 触发：
#   POST /repos/Eleven-L-97/futuretrading/dispatches  {"event_type":"realtime-tick"}
# 每个交易时段每 5 分钟一次；也可以手动 Run workflow。
on:
  repository_dispatch:
    types: [realtime-tick]
  workflow_dispatch:
    inputs:
      force_history:
        description: '忽略 15 分钟节流，立即写一次历史与 CSV（测试用）'
        type: boolean
        default: false

permissions:
  contents: write        # 需要把 data/*.csv 提交回仓库

concurrency:
  group: realtime
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
      HISTORY_MODE: always
      HISTORY_INTERVAL_MIN: '15'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行实时盯盘
        run: python main.py --mode realtime ${{ inputs.force_history && '--force-history' || '' }}

      - name: 提交历史 CSV
        run: |
          git config user.name "futures-bot"
          git config user.email "futures-bot@users.noreply.github.com"
          if [ -d data ] && [ -n "$(git status --porcelain data)" ]; then
            git add data
            git commit -m "history: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase --autostash
            git push
          else
            echo "没有新的历史数据，跳过提交"
          fi
