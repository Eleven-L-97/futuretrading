name: 日内盯盘

# 触发方式：Cloudflare Worker 每 5 分钟 repository_dispatch 一次。
# 注意：不要同时开 GitHub schedule，两边同分钟触发会互相挤掉（排队中的那条会被取消），
#       并让飞书接口承受双倍请求。需要临时停用 Worker 时，手动跑一次即可。
on:
  repository_dispatch:
    types: [realtime-tick]
  workflow_dispatch:
    inputs:
      force_history:
        description: '忽略 15 分钟节流，立即写一次历史与 CSV（测试用）'
        type: boolean
        default: false

permissions:
  contents: write        # 需要把 data/*.csv 提交回仓库

concurrency:
  group: realtime
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
      HISTORY_MODE: always
      HISTORY_INTERVAL_MIN: '15'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行实时盯盘
        run: python -u main.py --mode realtime ${{ inputs.force_history && '--force-history' || '' }}

      - name: 提交历史 CSV
        run: |
          git config user.name "futures-bot"
          git config user.email "futures-bot@users.noreply.github.com"
          if [ -d data ] && [ -n "$(git status --porcelain data)" ]; then
            git add data
            git commit -m "history: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase --autostash
            git push
          else
            echo "没有新的历史数据，跳过提交"
          fi
