name: 绩效指标

# 由外部定时器触发：每月 28-31 日 18:20（北京时间），脚本内部判断是否月末
#   POST /repos/Eleven-L-97/futuretrading/dispatches  {"event_type":"monthly-perf"}
on:
  repository_dispatch:
    types: [monthly-perf]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monthly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 计算绩效
        run: python main.py --mode monthly
