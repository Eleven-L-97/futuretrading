name: 绩效指标

# 触发方式：
#   1) 外部定时器：{"event_type":"monthly-perf"}
#   2) 兜底：GitHub schedule（UTC 10:20 = 北京 18:20，28-31 日）
on:
  repository_dispatch:
    types: [monthly-perf]
  schedule:
    - cron: '20 10 28-31 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monthly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 计算绩效
        run: python main.py --mode monthly
