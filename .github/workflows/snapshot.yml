name: 收盘快照

# 触发方式：
#   1) 外部定时器：{"event_type":"daily-snapshot"}
#   2) 兜底：GitHub schedule（UTC 10:10 = 北京 18:10）
# 手动触发时可指定日期，用来补算/重算历史快照。
on:
  repository_dispatch:
    types: [daily-snapshot]
  schedule:
    - cron: '10 10 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '业务日期 YYYY-MM-DD（留空=今天）；补录交易后用它重算历史快照'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 持仓归集 + 每日快照
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            echo "重算指定日期：${{ inputs.date }}"
            python main.py --mode daily --date "${{ inputs.date }}"
          else
            python main.py --mode daily
          fi
